# Render blueprint for the TrackFit API (free web service).
# Render > New > Blueprint > pick this repo. Values marked sync: false are
# asked for once in the dashboard and never stored in git.
# Database migrations are run by hand (npm run db:migrate), not on deploy.
services:
  - type: web
    name: trackfit-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    # Web-only changes don't redeploy the API.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Neon connection string (pooled), ends in ?sslmode=require
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY # paste the whole key, including the BEGIN/END lines
        sync: false
      - key: APP_URL # e.g. https://trackfit-xxxx.web.app
        sync: false
      # Web Push for reminders: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT # mailto:you@example.com
        sync: false
      # External cron sends this to POST /jobs/reminders (README, "Reminders").
      - key: CRON_SECRET
        sync: false
      # Email (README, Deploying step 7). Set in the dashboard, not here, so a
      # Blueprint sync never resets them. MAIL_PROVIDER: "resend", or "console"
      # to only log. Unset means console.
      - key: MAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM # on the domain verified in Resend, e.g. TrackFit <hello@mail.your-domain>
        sync: false
      - key: MAIL_REPLY_TO # optional: an inbox you read, so replies reach you
        sync: false
      # "false" switches Clubs off everywhere. Unset means on.
      - key: CLUBS_ENABLED
        sync: false
      # Never set DEV_AUTH_BYPASS here.
